<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- USER -->
  <rect x="380" y="20" width="140" height="70" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-size="22">🌐</text>
  <text x="450" y="70" text-anchor="middle" font-size="12" font-weight="600">User / Browser</text>
  <text x="450" y="84" text-anchor="middle" font-size="10" fill="#6b7280">HTTP Client</text>

  <!-- USER → GATEWAY -->
  <line x1="450" y1="90" x2="450" y2="140" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="462" y="115" font-size="10" fill="#2563eb">POST /shorten</text>
  <text x="462" y="130" font-size="10" fill="#16a34a">GET /{code}</text>

  <!-- API GATEWAY -->
  <rect x="320" y="140" width="260" height="70" rx="12" fill="#f8faff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="450" y="168" text-anchor="middle" font-size="20">🔀</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" font-weight="600">API Gateway</text>
  <text x="450" y="204" text-anchor="middle" font-size="10" fill="#6b7280">Routes requests to services</text>

  <!-- GATEWAY → SHORTENER -->
  <line x1="320" y1="175" x2="200" y2="250" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="240" y="215" font-size="10" fill="#6b7280">POST</text>

  <!-- GATEWAY → REDIRECT -->
  <line x1="450" y1="210" x2="450" y2="250" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="458" y="232" font-size="10" fill="#6b7280">GET</text>

  <!-- GATEWAY → ANALYTICS -->
  <line x1="580" y1="175" x2="700" y2="250" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="610" y="215" font-size="10" fill="#6b7280">fire & forget</text>

  <!-- SHORTENER SERVICE -->
  <rect x="90" y="260" width="220" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="200" y="290" text-anchor="middle" font-size="20">⚙️</text>
  <text x="200" y="310" text-anchor="middle" font-size="12" font-weight="600">Shortener Service</text>
  <text x="200" y="328" text-anchor="middle" font-size="10" fill="#6b7280">ID Generation + Base62</text>

  <!-- REDIRECT SERVICE -->
  <rect x="320" y="260" width="260" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="290" text-anchor="middle" font-size="20">↪️</text>
  <text x="450" y="310" text-anchor="middle" font-size="12" font-weight="600">Redirect Service</text>
  <text x="450" y="328" text-anchor="middle" font-size="10" fill="#6b7280">Handles GET + 302 redirect</text>

  <!-- ANALYTICS SERVICE -->
  <rect x="640" y="260" width="220" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="750" y="290" text-anchor="middle" font-size="20">📊</text>
  <text x="750" y="310" text-anchor="middle" font-size="12" font-weight="600">Analytics Service</text>
  <text x="750" y="328" text-anchor="middle" font-size="10" fill="#6b7280">Click tracking + batch flush</text>

  <!-- REDIS -->
  <rect x="350" y="390" width="220" height="90" rx="12" fill="#fff0f0" stroke="#dc2626" stroke-width="1.8"/>
  <text x="460" y="420" text-anchor="middle" font-size="20">⚡</text>
  <text x="460" y="442" text-anchor="middle" font-size="12" font-weight="600">Redis Cache</text>
  <text x="460" y="460" text-anchor="middle" font-size="10" fill="#6b7280">&lt;1ms reads · INCR counters</text>

  <!-- POSTGRES -->
  <rect x="120" y="470" width="240" height="100" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8"/>
  <text x="240" y="505" text-anchor="middle" font-size="22">🗄️</text>
  <text x="240" y="530" text-anchor="middle" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="240" y="550" text-anchor="middle" font-size="10" fill="#6b7280">Persistent Storage</text>
  <text x="240" y="565" text-anchor="middle" font-size="10" fill="#6b7280">Source of Truth</text>

  <!-- CONNECTIONS -->

  <!-- Shortener → Postgres -->
  <line x1="200" y1="340" x2="240" y2="470" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)"/>
  <text x="130" y="410" font-size="10" fill="#ea580c">INSERT URL</text>

  <!-- Redirect → Redis -->
  <line x1="450" y1="340" x2="460" y2="390" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="370" font-size="10" fill="#dc2626">check cache</text>

  <!-- Redis → Postgres (cache miss) -->
  <line x1="350" y1="430" x2="280" y2="470" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="270" y="450" font-size="10" fill="#6b7280">cache miss</text>

  <!-- Analytics → Redis -->
  <line x1="640" y1="340" x2="570" y2="410" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="610" y="380" font-size="10" fill="#2563eb">INCR counter</text>

  <!-- Analytics → Postgres (batch flush) -->
  <path d="M750 340 Q760 480 360 520"
        fill="none"
        stroke="#94a3b8"
        stroke-width="1.6"
        stroke-dasharray="4,3"
        marker-end="url(#arrow)"/>
  <text x="690" y="460" font-size="10" fill="#6b7280">flush every 5 min</text>

</svg>